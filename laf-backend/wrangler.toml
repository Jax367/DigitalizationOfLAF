name = "laf-backend"
main = "src/index.ts"
workers_dev = false
preview_urls = false
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "laf-database"
# Local development placeholder. Replace with the ID from `wrangler d1 create` before remote use.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "laf-images"

[triggers]
crons = ["0 * * * *"]

[[ratelimits]]
name = "ENTRY_LIMITER"
namespace_id = "1101"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1102"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1103"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1104"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1105"
simple = { limit = 10, period = 60 }
